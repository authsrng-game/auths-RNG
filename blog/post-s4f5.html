<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>post</title>
		<style>
			body {
				background-color: #0e0e0e;
				color: #dcdcdc;
				font-family: monospace;
				margin: 0;
				padding: 28px;
				line-height: 1.7;
				font-size: 17px;
			}
			.container {
				max-width: 540px;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.4rem;
				font-weight: normal;
				letter-spacing: 0.06em;
				margin: 0 0 1.2em 0;
			}
			p {
				margin: 0 0 1em 0;
				opacity: 0.88;
			}
			a {
				color: #dcdcdc;
				text-decoration: none;
				border-bottom: 1px dotted #444;
			}
			a:hover {
				opacity: 0.7;
			}
			.back-link {
				display: inline-block;
				margin-top: 2em;
				padding: 8px 16px;
				background: #1a1a1a;
				border: 1px solid #2a2a2a;
				border-radius: 2px;
				text-decoration: none;
				border-bottom: none;
			}
			.back-link:hover {
				background: #222;
				opacity: 1;
			}
		</style>
	</head>
	<body>
		<div class="container" id="post">loading post…</div>
		<a class="back-link" href="blog.html" target="_blank" rel="noopener noreferrer">← back</a>
		<script>
			// Generated code starts here on 2026-09-11T09:05:19Z:
			const params = new URLSearchParams(location.search);
			const id = params.get('id');
			const container = document.getElementById('post');

			function setError(msg) {
				const p = document.createElement('p');
				p.textContent = msg;
				container.replaceChildren(p);
			}

			// Validate id to prevent path traversal and invalid inputs
			if (!id) {
				setError('no post selected');
			} else if (!/^[a-zA-Z0-9_-]+$/.test(id)) {
				setError('invalid post id');
			} else {
				fetch('posts/' + id + '.html')
					.then((r) => {
						if (!r.ok) throw new Error('post not found');
						return r.text();
					})
					.then((html) => {
						container.innerHTML = html;
					})
					.catch(() => {
						setError('post not found');
					});
			}
			// Generated code ends here on 2026-09-11T09:05:19Z:
		</script>
	</body>
</html>
