name: discord notify

on:
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published]
  fork:
  watch:
    types: [started]

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: send PR event to discord
        if: github.event_name == 'pull_request'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> pr ${{ github.event.action }}: #${{ github.event.pull_request.number }} $TITLE
          url: ${{ github.event.pull_request.html_url }}
          author: ${{ github.actor }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue event to discord
        if: github.event_name == 'issues'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> issue ${{ github.event.action }}: #${{ github.event.issue.number }} $TITLE
          url: ${{ github.event.issue.html_url }}
          author: ${{ github.actor }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue comment to discord
        if: github.event_name == 'issue_comment'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BODY: ${{ github.event.comment.body }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> new comment on #${{ github.event.issue.number }}
          url: ${{ github.event.comment.html_url }}
          author: ${{ github.actor }}
          comment: $BODY" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send release to discord
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> release published: ${{ github.event.release.tag_name }}
          url: ${{ github.event.release.html_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send fork to discord
        if: github.event_name == 'fork'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> repo forked by ${{ github.actor }}
          url: ${{ github.event.forkee.html_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send star to discord
        if: github.event_name == 'watch'
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          jq -n \
            --arg content "<@1227759305852190801> star added by ${{ github.actor }}
          repo: ${{ github.repository }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"