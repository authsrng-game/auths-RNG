name: nerimity notify

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, closed, synchronize, edited]
  issues:
    types: [opened, closed, reopened, edited]
  issue_comment:
    types: [created]
  release:
    types: [published]
  fork:
  watch:
    types: [started]
  workflow_run:
    workflows: ['*']
    types: [completed]
  deployment_status:

jobs:
  nerimity:
    runs-on: ubuntu-latest
    steps:
      - name: send push to nerimity
        if: github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --arg content "push: auths-RNG@${{ github.ref_name }}
          commit: ${{ github.sha }}
          url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          author: ${{ github.actor }}
          message: $MESSAGE" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send PR event to nerimity
        if: github.event_name == 'pull_request'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          jq -n \
            --arg content "pr ${{ github.event.action }}: #${{ github.event.pull_request.number }} $TITLE
          url: ${{ github.event.pull_request.html_url }}
          author: ${{ github.actor }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue event to nerimity
        if: github.event_name == 'issues'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          jq -n \
            --arg content "issue ${{ github.event.action }}: #${{ github.event.issue.number }} $TITLE
          url: ${{ github.event.issue.html_url }}
          author: ${{ github.actor }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue comment to nerimity
        if: github.event_name == 'issue_comment'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          jq -n \
            --arg content "comment on #${{ github.event.issue.number }} $TITLE
          url: ${{ github.event.comment.html_url }}
          author: ${{ github.actor }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send release to nerimity
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
        run: |
          jq -n \
            --arg content "release published: ${{ github.event.release.tag_name }}
          url: ${{ github.event.release.html_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send fork to nerimity
        if: github.event_name == 'fork'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
        run: |
          jq -n \
            --arg content "repo forked by ${{ github.actor }}
          url: ${{ github.event.forkee.html_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send star to nerimity
        if: github.event_name == 'watch'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
        run: |
          jq -n \
            --arg content "star added by ${{ github.actor }}
          repo: ${{ github.repository }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send workflow run result to nerimity
        if: github.event_name == 'workflow_run'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
        run: |
          jq -n \
            --arg content "workflow '${{ github.event.workflow_run.name }}' ${{ github.event.workflow_run.conclusion }}
          branch: ${{ github.event.workflow_run.head_branch }}
          url: ${{ github.event.workflow_run.html_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send deployment status to nerimity
        if: github.event_name == 'deployment_status'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
        run: |
          jq -n \
            --arg content "deployment ${{ github.event.deployment_status.state }}: ${{ github.event.deployment.environment }}
          url: ${{ github.event.deployment_status.target_url }}" \
            '{content: $content}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"
