name: nerimity notify

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published]
  fork:
  watch:
    types: [started]

jobs:
  nerimity:
    runs-on: ubuntu-latest
    steps:
      - name: send push to nerimity
        if: github.event_name == 'push'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          jq -n \
            --arg ref "$REF_NAME" \
            --arg sha "$SHA" \
            --arg server "$SERVER_URL" \
            --arg repo "$REPOSITORY" \
            --arg actor "$ACTOR" \
            --arg msg "$MESSAGE" \
            '{content: ("push: auths-RNG@" + $ref + "\ncommit: " + $sha + "\nurl: " + $server + "/" + $repo + "/commit/" + $sha + "\nauthor: " + $actor + "\nmessage: " + $msg)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send PR event to nerimity
        if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HTML_URL: ${{ github.event.pull_request.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg action "$ACTION" \
            --arg number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$HTML_URL" \
            --arg actor "$ACTOR" \
            '{content: ("pr " + $action + ": #" + $number + " " + $title + "\nurl: " + $url + "\nauthor: " + $actor)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue event to nerimity
        if: github.event_name == 'issues'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          HTML_URL: ${{ github.event.issue.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg action "$ACTION" \
            --arg number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$HTML_URL" \
            --arg actor "$ACTOR" \
            '{content: ("issue " + $action + ": #" + $number + " " + $title + "\nurl: " + $url + "\nauthor: " + $actor)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send issue comment to nerimity
        if: github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          HTML_URL: ${{ github.event.comment.html_url }}
          ACTOR: ${{ github.actor }}
        run: |
          jq -n \
            --arg number "$NUMBER" \
            --arg title "$TITLE" \
            --arg url "$HTML_URL" \
            --arg actor "$ACTOR" \
            '{content: ("comment on #" + $number + " " + $title + "\nurl: " + $url + "\nauthor: " + $actor)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send release to nerimity
        if: github.event_name == 'release'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          HTML_URL: ${{ github.event.release.html_url }}
        run: |
          jq -n \
            --arg tag "$TAG_NAME" \
            --arg url "$HTML_URL" \
            '{content: ("release published: " + $tag + "\nurl: " + $url)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send fork to nerimity
        if: github.event_name == 'fork'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          HTML_URL: ${{ github.event.forkee.html_url }}
        run: |
          jq -n \
            --arg actor "$ACTOR" \
            --arg url "$HTML_URL" \
            '{content: ("repo forked by " + $actor + "\nurl: " + $url)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"

      - name: send star to nerimity
        if: github.event_name == 'watch'
        env:
          WEBHOOK: ${{ secrets.NERI_WEBHOOK }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          jq -n \
            --arg actor "$ACTOR" \
            --arg repo "$REPOSITORY" \
            '{content: ("star added by " + $actor + "\nrepo: " + $repo)}' |
          curl -H "Content-Type: application/json" \
            -X POST \
            -d @- \
            "$WEBHOOK"
